name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Syntax check
        run: bash -n bin/codex-healthkit scripts/check-release-version.sh scripts/render-demo.sh scripts/render-visuals.sh tests/run.sh tests/fixtures/fake-bin/codex tests/fixtures/fake-date-bin/date

      - name: ShellCheck
        run: shellcheck bin/codex-healthkit scripts/check-release-version.sh scripts/render-demo.sh scripts/render-visuals.sh tests/run.sh tests/fixtures/fake-bin/codex tests/fixtures/fake-date-bin/date

      - name: Test
        run: tests/run.sh

      - name: Validate JSON output
        run: |
          ./bin/codex-healthkit check --json | jq empty
          jq empty schemas/comparison-v0.2.schema.json

  macos:
    name: macOS smoke test
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n bin/codex-healthkit scripts/check-release-version.sh scripts/render-demo.sh scripts/render-visuals.sh tests/run.sh tests/fixtures/fake-bin/codex tests/fixtures/fake-date-bin/date

      - name: Test
        run: tests/run.sh

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install package QA tools
        run: python -m pip install --disable-pip-version-check build twine uv pipx

      - name: Check release versions
        run: scripts/check-release-version.sh v0.4.1

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith(".data/scripts/codex-healthkit") for name in names)
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          PY

      - name: Verify clean installs
        run: |
          wheel="$(printf '%s\n' dist/*.whl)"
          python -m venv /tmp/codex-healthkit-venv
          /tmp/codex-healthkit-venv/bin/python -m pip install --disable-pip-version-check "$wheel"
          /tmp/codex-healthkit-venv/bin/codex-healthkit --version
          CODEX_HOME="$(mktemp -d)" CODEX_SQLITE_HOME="$(mktemp -d)" \
            /tmp/codex-healthkit-venv/bin/codex-healthkit check --json > /tmp/codex-healthkit-report.json
          python - <<'PY'
          import json

          with open("/tmp/codex-healthkit-report.json", encoding="utf-8") as source:
              report = json.load(source)
          assert report["summary"]["status"] == "ok"
          assert all(value is False for value in report["safety"].values())
          PY
          uv_tool_dir="$(mktemp -d)"
          uv_bin_dir="$(mktemp -d)"
          UV_TOOL_DIR="$uv_tool_dir" UV_TOOL_BIN_DIR="$uv_bin_dir" uv tool install "$wheel"
          "$uv_bin_dir/codex-healthkit" --version
          UV_CACHE_DIR="$(mktemp -d)" uvx --from "$wheel" codex-healthkit --version
          pipx_home="$(mktemp -d)"
          pipx_bin_dir="$(mktemp -d)"
          PIPX_HOME="$pipx_home" PIPX_BIN_DIR="$pipx_bin_dir" python -m pipx install "$wheel"
          "$pipx_bin_dir/codex-healthkit" --version
