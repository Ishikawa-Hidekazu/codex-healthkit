[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-healthkit"
version = "0.4.1"
description = "Metadata-only local health reports for daily OpenAI Codex CLI operators."
readme = "README.pypi.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Ishikawa Hidekazu" },
]
keywords = ["codex", "cli", "diagnostics", "health-check", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Unix Shell",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ishikawa-Hidekazu/codex-healthkit"
Documentation = "https://github.com/Ishikawa-Hidekazu/codex-healthkit#readme"
Issues = "https://github.com/Ishikawa-Hidekazu/codex-healthkit/issues"
Changelog = "https://github.com/Ishikawa-Hidekazu/codex-healthkit/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = []
script-files = ["bin/codex-healthkit"]
